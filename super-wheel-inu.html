const cv=document.getElementById('c'),x=cv.getContext('2d');
let W,H,G;
function rs(){W=cv.width=innerWidth;H=cv.height=innerHeight;G=H*0.8}
addEventListener('resize',rs);rs();
let st='menu',score=0,best=0,bones=0,speed,t=0,obs=[],pick=[],parts=[],stars=[],shake=0;
try{best=+localStorage.getItem('ssw_best')||0}catch(e){}
const P={y:0,vy:0,r:34,rot:0,air:false,jumps:0};
for(let i=0;i<70;i++)stars.push([Math.random(),Math.random()*0.6,Math.random()*1.5+.5]);
const bld=[];for(let i=0;i<40;i++)bld.push([i*90,60+Math.random()*170,50+Math.random()*40]);
function reset(){st='play';score=0;bones=0;speed=6;obs=[];pick=[];parts=[];P.y=0;P.vy=0;P.jumps=0;t=0}
function jump(){
 if(st!=='play'){if(st==='menu'||st==='over')reset();return}
 if(P.jumps<2){P.vy=-(P.jumps?13:15.5);P.jumps++;for(let i=0;i<8;i++)parts.push([120,G-P.y,(Math.random()-.5)*4,Math.random()*-3,20,'#ffd34d'])}
}
addEventListener('keydown',e=>{if(['Space','ArrowUp','KeyW'].includes(e.code)){e.preventDefault();if(!e.repeat)jump()}});
cv.addEventListener('pointerdown',e=>{e.preventDefault();jump()});
function spawn(){
 const last=obs.length?obs[obs.length-1].x:0;
 if(W+50-last<Math.max(280,speed*38)+Math.random()*220)return;
 const k=Math.random();
 if(k<.6){const n=1+(Math.random()<.3);obs.push({x:W+50,w:34*n,h:38+Math.random()*22,t:'spike'})}
 else obs.push({x:W+50,w:46,h:64,t:'cone'});
 if(Math.random()<.7){const o=obs[obs.length-1];for(let i=0;i<3;i++)pick.push({x:o.x+o.w/2-40+i*40,y:110+Math.sin(i/2*Math.PI)*60+o.h*0.4})}
}
function upd(){
 t++;
 if(st!=='play')return;
 speed=Math.min(15,6+score/350);score+=speed*.1;
 P.vy+=0.75;P.y-=P.vy;
 if(P.y<=0){P.y=0;P.vy=0;P.jumps=0}
 P.air=P.y>0;
 P.rot+=speed/P.r*(P.air?.7:1);
 spawn();
 obs.forEach(o=>o.x-=speed);pick.forEach(p=>p.x-=speed);
 obs=obs.filter(o=>o.x>-100);
 const cx=120,cy=G-P.y-P.r;
 pick=pick.filter(p=>{if(Math.hypot(p.x-cx,(G-p.y)-cy)<P.r+14){bones++;score+=15;for(let i=0;i<6;i++)parts.push([p.x,G-p.y,(Math.random()-.5)*5,(Math.random()-.5)*5,18,'#fff']);return false}return p.x>-30});
 for(const o of obs){
  const hw=o.w/2-6,ox=o.x+o.w/2;
  if(Math.abs(ox-cx)<hw+P.r*.7&&P.y<o.h-6){st='over';shake=18;if(score>best){best=Math.floor(score);try{localStorage.setItem('ssw_best',best)}catch(e){}}
   for(let i=0;i<30;i++)parts.push([cx,cy,(Math.random()-.5)*10,(Math.random()-.8)*9,40,'#e8262b']);}
 }
 if(t%3===0)parts.push([cx-P.r,G-8,-speed*.5,-Math.random(),14,'rgba(255,255,255,.4)']);
}
function sky(){
 const g=x.createLinearGradient(0,0,0,H);g.addColorStop(0,'#0a0f35');g.addColorStop(.7,'#3a2c6e');g.addColorStop(1,'#d9684f');
 x.fillStyle=g;x.fillRect(0,0,W,H);
 x.fillStyle='#fff';stars.forEach(s=>{x.globalAlpha=.4+.6*Math.abs(Math.sin(t/40+s[0]*9));x.fillRect(s[0]*W,s[1]*H,s[2],s[2])});x.globalAlpha=1;
 const off=(t*speed*.25)%3600;
 [[.35,'#1a1650'],[1,'#120d38']].forEach(([f,c],li)=>{
  x.fillStyle=c;const o=(t*(st==='play'?speed:2)*f*.5)%3600;
  bld.forEach(b=>{let bx=((b[0]*(li?1.3:1)-o)%3600+3600)%3600-100;const bh=b[1]*(li?1.4:1);
   x.fillRect(bx,G-bh,b[2],bh);
   if(li){x.fillStyle='rgba(255,220,120,.5)';for(let wy=G-bh+10;wy<G-10;wy+=22)for(let wx=bx+8;wx<bx+b[2]-8;wx+=14)if((wx*wy|0)%7<2)x.fillRect(wx,wy,4,7);x.fillStyle=c}
  })});
}
function road(){
 x.fillStyle='#1b1b26';x.fillRect(0,G,W,H-G);
 x.fillStyle='#e8262b';x.fillRect(0,G,W,5);
 x.fillStyle='#ffd34d';const o=(t*speed)%80;for(let i=-1;i<W/80+1;i++)x.fillRect(i*80-o,G+(H-G)*.45,40,5);
}
function star(cx,cy,r,col){x.fillStyle=col;x.beginPath();for(let i=0;i<10;i++){const a=i*Math.PI/5-Math.PI/2,rr=i%2?r*.45:r;x.lineTo(cx+Math.cos(a)*rr,cy+Math.sin(a)*rr)}x.fill()}
function hero(){
 const cx=120,cy=G-P.y-P.r;
 const fl=Math.sin(t/4)*8+(P.air?-P.vy*1.5:0);
 x.fillStyle='#d4141c';x.beginPath();x.moveTo(cx-P.r*.3,cy-P.r*.8);
 x.bezierCurveTo(cx-P.r*2,cy-P.r*1.2+fl,cx-P.r*3,cy-P.r*.2-fl,cx-P.r*3.6,cy+fl*.8);
 x.bezierCurveTo(cx-P.r*2.4,cy+P.r*.5,cx-P.r*1.2,cy+P.r*.6,cx-P.r*.3,cy+P.r*.3);x.fill();
 x.fillStyle='#ff4b52';x.beginPath();x.moveTo(cx-P.r*.3,cy-P.r*.6);x.bezierCurveTo(cx-P.r*1.8,cy-P.r*.8+fl,cx-P.r*2.5,cy-P.r*.1,cx-P.r*3,cy+fl*.6);x.lineTo(cx-P.r*.3,cy);x.fill();
 x.fillStyle='rgba(0,0,0,.3)';x.beginPath();x.ellipse(cx,G+4,P.r*(1-P.y/500),7,0,0,7);x.fill();
 x.save();x.translate(cx,cy);x.rotate(P.rot);
 x.beginPath();x.arc(0,0,P.r,0,7);x.clip();
 if(IMG.complete)x.drawImage(IMG,-P.r*1.28,-P.r*1.28,P.r*2.56,P.r*2.56);
 x.restore();
}
function draw(){
 x.save();if(shake>0){x.translate((Math.random()-.5)*shake,(Math.random()-.5)*shake);shake*=.88}
 sky();road();
 pick.forEach(p=>{const by=G-p.y+Math.sin(t/10+p.x)*3;x.save();x.translate(p.x,by);x.rotate(.6);x.fillStyle='#fff';x.fillRect(-10,-4,20,8);x.beginPath();x.arc(-10,-4,5,0,7);x.arc(-10,4,5,0,7);x.arc(10,-4,5,0,7);x.arc(10,4,5,0,7);x.fill();x.restore()});
 obs.forEach(o=>{
  if(o.t==='spike'){x.fillStyle='#8c93a8';const n=o.w/34;for(let i=0;i<n;i++){x.beginPath();x.moveTo(o.x+i*34,G);x.lineTo(o.x+i*34+17,G-o.h);x.lineTo(o.x+i*34+34,G);x.fill()}
   x.fillStyle='#e8262b';x.fillRect(o.x,G-4,o.w,4)}
  else{x.fillStyle='#ff7a1a';x.beginPath();x.moveTo(o.x+8,G);x.lineTo(o.x+o.w/2,G-o.h);x.lineTo(o.x+o.w-8,G);x.fill();
   x.fillStyle='#fff';x.fillRect(o.x+14,G-o.h*.55,o.w-28,8);x.fillStyle='#222';x.fillRect(o.x,G-5,o.w,5)}
 });
 parts=parts.filter(p=>{p[0]+=p[2];p[1]+=p[3];p[4]--;x.globalAlpha=Math.max(0,p[4]/30);x.fillStyle=p[5];x.fillRect(p[0],p[1],4,4);x.globalAlpha=1;return p[4]>0});
 if(st!=='over'||t%2)hero();
 x.restore();
 const u=Math.min(W,H*1.2)/500+.6;
 x.textAlign='left';x.fillStyle='#fff';x.font=`${22*u}px Impact,sans-serif`;x.fillText(Math.floor(score),20,36*u);
 x.font=`${13*u}px Impact,sans-serif`;x.fillStyle='#ffd34d';x.fillText('BEST '+best+'   BONES '+bones,20,56*u);
 x.textAlign='center';
 if(st!=='play'){
  x.fillStyle='rgba(8,10,30,.65)';x.fillRect(0,0,W,H);
  x.fillStyle='#e8262b';x.font=`${Math.min(46*u,W/9)}px Impact,sans-serif`;
  x.fillText(st==='menu'?'SUPER WHEEL INU':'WIPEOUT!',W/2+3,H*.3+3);
  x.fillStyle='#ffd34d';x.fillText(st==='menu'?'SUPER WHEEL INU':'WIPEOUT!',W/2,H*.3);
  x.fillStyle='#fff';x.font=`${st==='menu'?Math.min(24*u,W/16):20*u}px Impact,sans-serif`;
  if(st==='menu')x.fillText('THE SHIBA WHEEL RUNNER',W/2,H*.3+40*u);
  else{x.fillText('Score '+Math.floor(score)+'   Bones '+bones,W/2,H*.3+34*u)}
  x.font=`${17*u}px Arial,sans-serif`;x.fillStyle='#fff';x.globalAlpha=.6+.4*Math.sin(t/12);
  x.fillText(st==='menu'?'Tap or press SPACE to roll':'Tap or press SPACE to retry',W/2,H*.3+(st==='menu'?80:70)*u);x.globalAlpha=1;
  x.font=`${13*u}px Arial,sans-serif`;x.fillStyle='#bbc';x.fillText('Double-jump over spikes and cones. Grab the bones!',W/2,H*.3+(st==='menu'?106:96)*u);
 }
}
(function loop(){upd();draw();requestAnimationFrame(loop)})();
